<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night City Animation</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{background:#050510;min-height:100vh;overflow:hidden}

        /* Sky */
        .sky-layer{position:fixed;inset:0;z-index:0;transition:opacity 5s ease-in-out}
        .sky-night{background:linear-gradient(180deg,#050510 0%,#0a0a1a 50%,#111128 100%);opacity:1}
        .sky-day{background:linear-gradient(180deg,#1a6bc4 0%,#4a9ff5 40%,#87ceeb 70%,#b8e4f9 100%);opacity:0}
        .sky-layer.active{opacity:1}

        /* Stars */
        .stars{position:fixed;inset:0;z-index:1;transition:opacity 5s ease-in-out}
        .star{position:absolute;width:1.5px;height:1.5px;background:rgba(255,255,255,.85);border-radius:50%;animation:twinkle var(--dur,4s) ease-in-out infinite var(--del,0s)}
        @keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.1}}

        /* Moon */
        .moon{position:fixed;top:6%;right:12%;width:75px;height:75px;background:radial-gradient(circle at 35% 35%,#fff 0%,#e8e8e8 50%,#bbb 100%);border-radius:50%;z-index:2;box-shadow:0 0 30px 8px rgba(255,255,255,.15),0 0 70px 25px rgba(255,255,255,.08);transition:opacity 5s ease-in-out,transform 5s ease-in-out;opacity:1;transform:translateY(0) scale(1);animation:moonGlow 6s ease-in-out infinite}
        .moon.hide{opacity:0;transform:translateY(30px) scale(0.6)}
        .moon::after{content:'';position:absolute;top:14px;left:18px;width:14px;height:14px;background:rgba(0,0,0,.06);border-radius:50%;box-shadow:24px 8px 0 6px rgba(0,0,0,.04),8px 28px 0 3px rgba(0,0,0,.03)}
        @keyframes moonGlow{0%,100%{box-shadow:0 0 30px 8px rgba(255,255,255,.15),0 0 70px 25px rgba(255,255,255,.08)}50%{box-shadow:0 0 45px 14px rgba(255,255,255,.22),0 0 95px 40px rgba(255,255,255,.12)}}

        /* Sun */
        .sun{position:fixed;top:6%;right:12%;width:80px;height:80px;background:radial-gradient(circle at 50% 50%,#fffbe6 0%,#ffe066 30%,#ffb800 70%,#ff8c00 100%);border-radius:50%;z-index:2;box-shadow:0 0 40px 15px rgba(255,224,102,.5),0 0 80px 30px rgba(255,184,0,.25),0 0 120px 50px rgba(255,140,0,.1);transition:opacity 5s ease-in-out,transform 5s ease-in-out;opacity:0;transform:translateY(30px) scale(0.6)}
        .sun.show{opacity:1;transform:translateY(0) scale(1);animation:sunPulse 5s ease-in-out infinite}
        @keyframes sunPulse{0%,100%{box-shadow:0 0 40px 15px rgba(255,224,102,.5),0 0 80px 30px rgba(255,184,0,.25),0 0 120px 50px rgba(255,140,0,.1)}50%{box-shadow:0 0 55px 20px rgba(255,224,102,.6),0 0 100px 40px rgba(255,184,0,.3),0 0 150px 60px rgba(255,140,0,.15)}}

        /* Skyline */
        .skyline{position:fixed;bottom:70px;left:0;right:0;height:42%;z-index:3;pointer-events:none;transition:filter 5s ease}
        .skyline.day{filter:brightness(2) saturate(0.2)}
        .b{position:absolute;bottom:0;border-radius:3px 3px 0 0;background:#060610;transition:background 5s ease}
        .skyline.day .b{background:#2a2a3a}
        .b::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(234,37,143,.35),transparent);transition:opacity 5s ease}
        .skyline.day .b::after{opacity:0}
        .b[data-tall="1"]::before{content:'';position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:#ea258f;border-radius:50%;box-shadow:0 0 8px 2px rgba(234,37,143,.5);animation:beacon 2.5s ease-in-out infinite}
        @keyframes beacon{0%,100%{opacity:1}50%{opacity:.2}}

        .w{position:absolute;border-radius:1px;transition:all 5s ease}
        .w.lit{background:rgba(255,255,220,.8);box-shadow:0 0 5px rgba(255,255,220,.35);animation:winFlicker var(--dur,5s) ease-in-out infinite var(--del,0s)}
        .skyline.day .w.lit{background:rgba(180,210,240,.35);box-shadow:none;animation:none}
        .w.dim{background:rgba(255,255,220,.12)}
        .skyline.day .w.dim{background:rgba(180,210,240,.15)}
        @keyframes winFlicker{0%,100%{opacity:1}50%{opacity:.5}}

        /* Lamps */
        .lamp{position:fixed;bottom:70px;z-index:4;pointer-events:none}
        .lamp::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:4px;height:100px;background:#1a1a2a;border-radius:2px}
        .lamp::after{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:22px;height:22px;background:rgba(255,255,230,.9);border-radius:50%;box-shadow:0 0 25px 8px rgba(255,255,230,.4),0 0 60px 22px rgba(255,255,230,.15);transition:all 5s ease}
        .lamp.off::after{background:rgba(80,80,80,.2);box-shadow:none}

        /* Road */
        .road{position:fixed;bottom:0;left:0;right:0;height:70px;background:linear-gradient(to top,#040408,#0c0c1a);z-index:4;pointer-events:none;transition:background 5s ease}
        .road.day-road{background:linear-gradient(to top,#444,#555)}
        .road::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(234,37,143,.25);box-shadow:0 0 10px rgba(234,37,143,.2);transition:opacity 5s ease}
        .road.day-road::before{opacity:.2}
        .road-line{position:absolute;top:50%;left:0;right:0;height:2px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#ea258f 0px,#ea258f 45px,transparent 45px,transparent 90px);animation:roadMove .6s linear infinite;opacity:.7}
        @keyframes roadMove{from{background-position:0 0}to{background-position:-90px 0}}

        /* Truck */
        .truck-wrap{position:fixed;bottom:18px;z-index:5}
        .truck{position:relative;width:260px;height:130px}
        .tc{position:absolute;bottom:32px;left:0;width:80px;height:70px;background:#111;border:2px solid #222;border-radius:8px 8px 0 8px;z-index:2}
        .tg{position:absolute;top:7px;left:7px;right:5px;height:32px;background:linear-gradient(180deg,rgba(200,220,255,.25),rgba(150,180,220,.12));border:1.5px solid rgba(200,220,255,.35);border-radius:5px 6px 3px 3px}
        .tl{position:absolute;bottom:12px;left:6px;width:12px;height:8px;background:#ffe066;border-radius:3px;box-shadow:0 0 20px 6px rgba(255,224,102,.5)}
        .tb{position:absolute;bottom:32px;left:62px;width:185px;height:92px;background:#111;border:2px solid #222;border-radius:5px;z-index:1;overflow:hidden}
        .tbr{position:absolute;inset:5px;background:#ea258f;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white;letter-spacing:4px}
        .ts{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ea258f,#ff6ebe,#ea258f);box-shadow:0 0 8px rgba(234,37,143,.5)}
        .tw{position:absolute;bottom:6px;width:42px;height:42px;background:#080808;border:3.5px solid #222;border-radius:50%;z-index:3;animation:wheelSpin .35s linear infinite}
        .tw::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:#ea258f;border-radius:50%;box-shadow:0 0 6px rgba(234,37,143,.5)}
        .tw::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border:2px solid #333;border-radius:50%}
        .twf{left:14px}.twb{right:28px}
        @keyframes wheelSpin{to{transform:rotate(360deg)}}
        .smoke{position:absolute;bottom:45px;right:20px;width:60px;height:40px}
        .sp{position:absolute;width:10px;height:10px;background:rgba(60,60,70,.3);border-radius:50%;animation:smokeUp 1s ease-out infinite var(--dl,0s)}
        .sp:nth-child(1){right:0;--dl:0s}.sp:nth-child(2){right:12px;--dl:.25s}.sp:nth-child(3){right:24px;--dl:.5s}
        @keyframes smokeUp{0%{opacity:.35;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(2.2)}}
        .beam{position:absolute;left:-160px;top:42%;transform:translateY(-50%);width:180px;height:50px;background:radial-gradient(ellipse at left,rgba(255,255,230,.2),transparent 70%);filter:blur(10px)}
        .tail{position:absolute;bottom:38px;right:58px;width:6px;height:18px;background:#ef4444;border-radius:2px;box-shadow:0 0 12px 3px rgba(239,68,68,.4);z-index:4}

        /* Particles */
        .particles{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity 5s ease}
        .particle{position:absolute;width:3px;height:3px;background:#ea258f;border-radius:50%;opacity:.18;animation:particleDrift var(--dur,10s) ease-in-out infinite var(--del,0s)}
        @keyframes particleDrift{0%,100%{transform:translateY(0) translateX(0);opacity:.18}50%{transform:translateY(-60px) translateX(10px);opacity:.06}}

        /* Label */
        .label{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.3);font-family:Inter,sans-serif;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase}
    </style>
</head>
<body>
    <div class="sky-layer sky-night" id="skyNight"></div>
    <div class="sky-layer sky-day" id="skyDay"></div>
    <div class="stars" id="stars"></div>
    <div class="moon" id="moon"></div>
    <div class="sun" id="sun"></div>
    <div class="skyline" id="skyline"></div>
    <div class="lamp" style="left:12%"></div>
    <div class="lamp" style="left:38%"></div>
    <div class="lamp" style="left:64%"></div>
    <div class="lamp" style="left:88%"></div>
    <div class="road" id="road"><div class="road-line"></div></div>
    <div class="truck-wrap" id="truck">
        <div class="truck">
            <div class="beam"></div>
            <div class="smoke"><div class="sp"></div><div class="sp"></div><div class="sp"></div></div>
            <div class="tc"><div class="tg"></div><div class="tl"></div></div>
            <div class="tb"><div class="tbr">DELIVERY</div><div class="ts"></div></div>
            <div class="tail"></div>
            <div class="tw twf"></div>
            <div class="tw twb"></div>
        </div>
    </div>
    <div class="particles" id="particles"></div>
    <div class="label">Night City Animation</div>

    <script>
    // Stars
    (function(){
        var c=document.getElementById('stars');
        for(var i=0;i<80;i++){
            var s=document.createElement('div');s.className='star';
            s.style.top=Math.random()*55+'%';s.style.left=Math.random()*100+'%';
            s.style.setProperty('--dur',(3+Math.random()*5)+'s');
            s.style.setProperty('--del',(Math.random()*5)+'s');
            var sz=1+Math.random()*1.5;s.style.width=sz+'px';s.style.height=sz+'px';
            c.appendChild(s);
        }
    })();

    // Skyline
    (function(){
        var sl=document.getElementById('skyline');
        var buildings=[
            {l:1,w:50,h:160},{l:7,w:70,h:240},{l:15,w:40,h:130},
            {l:20,w:90,h:290,t:1},{l:32,w:55,h:155},{l:39,w:100,h:215},
            {l:51,w:45,h:180},{l:57,w:85,h:270,t:1},{l:68,w:55,h:145},
            {l:74,w:95,h:235},{l:86,w:60,h:190},{l:94,w:45,h:125}
        ];
        buildings.forEach(function(b){
            var el=document.createElement('div');el.className='b';
            el.style.left=b.l+'%';el.style.width=b.w+'px';el.style.height=b.h+'px';
            if(b.t)el.setAttribute('data-tall','1');
            var cols=Math.floor((b.w-14)/14),rows=Math.floor((b.h-30)/18);
            for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
                var w=document.createElement('div');w.className='w '+(Math.random()>.35?'lit':'dim');
                w.style.left=(8+c*14)+'px';w.style.top=(12+r*18)+'px';
                w.style.width='8px';w.style.height='10px';
                w.style.setProperty('--dur',(3+Math.random()*6)+'s');
                w.style.setProperty('--del',(Math.random()*5)+'s');
                el.appendChild(w);
            }
            sl.appendChild(el);
        });
    })();

    // Particles
    (function(){
        var pc=document.getElementById('particles');
        for(var i=0;i<5;i++){
            var p=document.createElement('div');p.className='particle';
            p.style.top=(15+Math.random()*55)+'%';p.style.left=(5+Math.random()*90)+'%';
            p.style.setProperty('--dur',(8+Math.random()*8)+'s');
            p.style.setProperty('--del',(Math.random()*6)+'s');
            pc.appendChild(p);
        }
    })();

    // Night/Day cycle
    (function(){
        var skyNight=document.getElementById('skyNight');
        var skyDay=document.getElementById('skyDay');
        var starsEl=document.getElementById('stars');
        var moonEl=document.getElementById('moon');
        var sunEl=document.getElementById('sun');
        var skylineEl=document.getElementById('skyline');
        var roadEl=document.getElementById('road');
        var lamps=document.querySelectorAll('.lamp');

        function goToNight(){
            skyNight.classList.add('active');skyDay.classList.remove('active');
            starsEl.style.opacity='1';moonEl.classList.remove('hide');sunEl.classList.remove('show');
            skylineEl.classList.remove('day');roadEl.classList.remove('day-road');
            lamps.forEach(function(l){l.classList.remove('off')});
        }
        function goToDay(){
            skyNight.classList.remove('active');skyDay.classList.add('active');
            starsEl.style.opacity='0';moonEl.classList.add('hide');sunEl.classList.add('show');
            skylineEl.classList.add('day');roadEl.classList.add('day-road');
            lamps.forEach(function(l){l.classList.add('off')});
        }
        function cycle(){
            goToNight();
            setTimeout(function(){goToDay();setTimeout(cycle,12000);},12000);
        }
        cycle();
    })();

    // Truck
    (function(){
        var truck=document.getElementById('truck');
        var W=window.innerWidth;
        var truckW=260;
        var center=(W-truckW)/2;
        var left=-truckW-100;
        var dur=16000;
        function pass(){
            truck.style.transition='none';truck.style.left=(W+50)+'px';
            truck.offsetHeight;
            truck.style.transition='left '+dur+'ms linear';
            truck.style.left=left+'px';
        }
        pass();
        setInterval(pass,dur+2000);
    })();
    </script>
</body>
</html>
